<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控醣小達人：16宮格健康翻翻樂</title>
<style>
    body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: linear-gradient(135deg, #e6fffa 0%, #c6f6d5 100%);
        margin: 0;
        padding: 20px;
        color: #2d3748;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }
    header {
        position: relative;
        text-align: center;
        margin-bottom: 20px;
        width: 100%;
        max-width: 900px;
    }
    h1 {
        color: #234e52;
        margin: 0 0 8px 0;
        font-size: 26px;
    }
    p.subtitle {
        color: #2b6cb0;
        margin: 0;
        font-size: 15px;
    }
    
    /* 設計人標籤樣式 */
    .author-tag {
        position: absolute;
        top: 0;
        right: 0;
        background: rgba(35, 78, 82, 0.1);
        color: #234e52;
        border: 1px solid rgba(35, 78, 82, 0.2);
        padding: 4px 12px;
        border-radius: 16px;
        font-size: 13px;
        font-weight: bold;
        backdrop-filter: blur(4px);
    }

    .score-board {
        background: white;
        padding: 10px 20px;
        border-radius: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        margin-bottom: 20px;
        font-size: 16px;
        font-weight: bold;
        color: #319795;
    }
    .grid-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        max-width: 900px;
        width: 100%;
        margin-bottom: 20px;
    }
    .flip-card {
        background-color: transparent;
        height: 140px;
        perspective: 1000px;
        cursor: pointer;
    }
    .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s;
        transform-style: preserve-3d;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 10px;
        box-sizing: border-box;
    }
    .flip-card-front {
        background: #ffffff;
        border: 3px solid #319795;
        color: #234e52;
    }
    .flip-card-front .card-num {
        font-size: 13px;
        color: #718096;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .flip-card-front .card-item {
        font-size: 18px;
        font-weight: bold;
    }
    .flip-card-back {
        transform: rotateY(180deg);
        color: white;
    }
    .flip-card-back.yes {
        background: #38a169;
        border: 3px solid #276749;
    }
    .flip-card-back.no {
        background: #e53e3e;
        border: 3px solid #9b2c2c;
    }
    .badge {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 5px;
        background: rgba(255,255,255,0.2);
        padding: 3px 10px;
        border-radius: 8px;
    }
    .desc {
        font-size: 12px;
        line-height: 1.3;
    }
    .reset-btn {
        background: #319795;
        color: white;
        border: none;
        padding: 10px 25px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: background 0.2s;
    }
    .reset-btn:hover {
        background: #2c7a7b;
    }

    /* 手機版適應調整 */
    @media (max-width: 600px) {
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .author-tag {
            position: static;
            display: inline-block;
            margin-bottom: 8px;
        }
        .grid-container {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
</head>
<body>

<header>
    <div class="author-tag">設計人：林珈朵營養師</div>
    <h1>🍎 控醣小達人：16宮格健康翻翻樂</h1>
    <p class="subtitle">點擊卡片翻開，看看哪些食物是糖尿病友「適宜」或「避免」的吧！</p>
</header>

<div class="score-board">
    已探索卡片：<span id="score">0</span> / 16
</div>

<div class="grid-container" id="gameGrid"></div>

<button class="reset-btn" onclick="resetGame()">重新重置遊戲</button>

<script>
const cardData = [
    { item: "🥗 涼拌青菜", type: "yes", desc: "蒸煮涼拌較佳，富含纖維助穩血糖" },
    { item: "🍖 糖醋排骨", type: "no", desc: "含糖烹調與勾芡，熱量與糖分高" },
    { item: "🥜 花生與瓜子", type: "no", desc: "堅果類油脂含量極高，應避免" },
    { item: "🍵 無糖烏龍茶", type: "yes", desc: "取代含糖飲料與果汁的絕佳選擇" },
    { item: "🥟 炸水餃 / 煎餃", type: "no", desc: "皮屬主食且油煎吸油量大，不宜" },
    { item: "🐟 清蒸魚海鮮", type: "yes", desc: "低脂優質蛋白質，烹調清淡最健康" },
    { item: "🌭 香腸與火腿", type: "no", desc: "加工肉品含鈉與油脂高，應避免" },
    { item: "🍲 涮涮鍋清湯", type: "yes", desc: "以一人份清湯為主，少吃麻辣鍋" },
    { item: "🍳 蟹黃與魚卵", type: "no", desc: "高膽固醇食物，應嚴格避免" },
    { item: "🍔 烤雞肉漢堡", type: "yes", desc: "選烤雞不選炸肉，不加美乃滋與起士" },
    { item: "🍟 裹粉炸薯條", type: "no", desc: "澱粉類經油炸吸油量高，應少選" },
    { item: "🥗 義大利油醋沙拉", type: "yes", desc: "以油醋醬替代高熱量沙拉醬" },
    { item: "🍡 蛋餃與魚餃", type: "no", desc: "加工火鍋料油脂含量高，應少選" },
    { item: "🍮 代糖無糖果凍", type: "yes", desc: "滿足甜點口腹之慾又控醣的好選擇" },
    { item: "🍜 濃湯與勾芡羹", type: "no", desc: "太白粉勾芡與奶油熱量高，應避開" },
    { item: "🌽 玉米與芋頭", type: "yes", desc: "屬主食類可適量攝取，需計入澱粉份量" }
];

let flippedCount = 0;
const flippedSet = new Set();

function initGame() {
    const grid = document.getElementById('gameGrid');
    grid.innerHTML = '';
    flippedCount = 0;
    flippedSet.clear();
    document.getElementById('score').innerText = flippedCount;

    cardData.forEach((data, index) => {
        const card = document.createElement('div');
        card.className = 'flip-card';
        card.onclick = () => flipCard(card, index);

        card.innerHTML = `
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <div class="card-num">第 ${index + 1} 格</div>
                    <div class="card-item">${data.item}</div>
                </div>
                <div class="flip-card-back ${data.type}">
                    <div class="badge">${data.type === 'yes' ? '✅ 適宜食用' : '❌ 避免食用'}</div>
                    <div class="desc">${data.desc}</div>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function flipCard(card, index) {
    if (!card.classList.contains('flipped')) {
        card.classList.add('flipped');
        if (!flippedSet.has(index)) {
            flippedSet.add(index);
            flippedCount++;
            document.getElementById('score').innerText = flippedCount;
        }
    } else {
        card.classList.remove('flipped');
    }
}

function resetGame() {
    initGame();
}

window.onload = initGame;
</script>

</body>
</html>
